[pytest]
markers =
    integration: marks integration tests for all bosses.
    manual_destructive: marks tests that can reset, move, or otherwise manipulate a live game.
    iudex: marks integration tests for the Iudex Gundyr boss fight.
    vordt: marks integration tests for the Vordt of the Boreal Valley boss fight.

python_files = test_*.py
# Disable live and destructive tests by default
addopts = -m "not integration and not manual_destructive"